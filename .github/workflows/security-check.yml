
name: HTML CSS JavaScript Security Check

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-check:
    name: HTML CSS and JavaScript Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Check for conflict markers
        shell: bash
        run: |
          if grep -RnE '^(<<<<<<< |=======|>>>>>>> )' \
            --include='*.[hH][tT][mM][lL]' --include='*.[cC][sS][sS]' \
            --include='*.[jJ][sS]' --include='*.[mM][jJ][sS]' --include='*.[cC][jJ][sS]' .; then
            echo "Error: Conflict markers detected."
            exit 1
          fi

      - name: Check for unsafe HTML patterns
        shell: bash
        run: |
          if grep -RniE \
            '(javascript:|<script[^>]+src="http://)' \
            --include='*.[hH][tT][mM][lL]' .; then
            echo "Warning: Review potentially unsafe HTML."
            exit 1
          fi

      - name: Check JavaScript syntax and potentially unsafe patterns
        shell: bash
        run: |
          failed=0
          while IFS= read -r -d '' file; do
            echo "Checking JavaScript: $file"
            if ! node --check < "$file"; then
              echo "::error file=${file#./}::JavaScript syntax error"
              failed=1
            fi
            if grep -nEi '(\beval[[:space:]]*\(|\bnew[[:space:]]+Function[[:space:]]*\(|\bdocument[[:space:]]*\.[[:space:]]*write[[:space:]]*\(|\.innerHTML[[:space:]]*=)' "$file"; then
              echo "::error file=${file#./}::Potentially unsafe JavaScript pattern; review required"
              failed=1
            fi
          done < <(find . -type f \( -iname '*.js' -o -iname '*.mjs' -o -iname '*.cjs' \) -not -path './.git/*' -print0)
          exit "$failed"
